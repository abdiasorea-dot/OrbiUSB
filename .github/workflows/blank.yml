gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace assembleDebug

      # Conserva el artefacto descargable desde la página de cada ejecución.
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: OrbiUSB-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Las Pull Requests solo compilan y validan; no publican Releases.
      - name: Publicar APK en GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OrbiUSB Debug #${{ github.run_number }}
          body: |
            Compilación automática de OrbiUSB.

            - Build: #${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Rama: ${{ github.ref_name }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

      # Actualiza la sección delimitada en README.md, o la añade si no existe.
      - name: Actualizar enlace de descarga en README
        if: github.event_name != 'pull_request'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8") if readme.exists() else ""

          start = "<!-- ORBIUSB_LATEST_BUILD_START -->"
          end = "<!-- ORBIUSB_LATEST_BUILD_END -->"

          build = os.environ["BUILD_NUMBER"]
          commit = os.environ["COMMIT_SHA"][:7]
          branch = os.environ["BRANCH_NAME"]
          repo = os.environ["REPOSITORY"]
          date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          apk_url = f"https://github.com/{repo}/releases/latest/download/app-debug.apk"

          section = (
              "## 📱 Última compilación de OrbiUSB\n\n"
              f"- **APK:** [Descargar última compilación]({apk_url})\n"
              f"- **Build:** #{build}\n"
              f"- **Fecha:** {date}\n"
              f"- **Rama:** `{branch}`\n"
              f"- **Commit:** `{commit}`\n"
              "- **Estado:** Compilación y publicación exitosas\n"
          )

          if start in text and end in text:
              before, remainder = text.split(start, 1)
              _, after = remainder.split(end, 1)
              updated = before + start + "\n" + section + end + after
          else:
              updated = text.rstrip()
              if updated:
                  updated += "\n\n"
