name: Build OrbiUSB APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK Debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar última versión APK
  uses: softprops/action-gh-release@v2
  with:
    tag_name: latest
    name: Última compilación de OrbiUSB
    body: |
      Última compilación automática de OrbiUSB.
      Build: ${{ github.run_number }}
      Commit: ${{ github.sha }}
    files: app/build/outputs/apk/debug/app-debug.apk
    overwrite_files: true
    make_latest: true

    - name: Actualizar información de descarga
  run: |
    DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
    cat > latest-build.md <<EOF
    ## 📱 Última versión de OrbiUSB

    - **Compilación:** #${{ github.run_number }}
    - **Fecha:** ${DATE}
    - **Estado:** Compilación exitosa

    ### Descargar

    [⬇️ DESCARGAR ÚLTIMO APK](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk)
    EOF

    python -c "from pathlib import Path; p=Path('README.md'); s=p.read_text(); a='<!-- LATEST_BUILD_START -->'; b='<!-- LATEST_BUILD_END -->'; n=Path('latest-build.md').read_text(); p.write_text(s.split(a)[0]+a+'\n'+n+'\n'+b+s.split(b)[1])"
